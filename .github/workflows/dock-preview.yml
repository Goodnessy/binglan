name: Dock preview validation

on:
  push:
    branches:
      - fix/dock-tray-restore-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dock:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Dock identity, grouping and restoration rules
        run: dotnet run --project tests/BingLan.DockTests/BingLan.DockTests.csproj -c Release

      - name: Run core smoke tests
        run: dotnet run --project tests/BingLan.SmokeTests/BingLan.SmokeTests.csproj -c Release

      - name: Compile Windows desktop application
        run: dotnet build src/BingLan.App/BingLan.App.csproj -c Release

      - name: Publish portable Windows x64 preview
        run: dotnet publish src/BingLan.App/BingLan.App.csproj -c Release -r win-x64 --self-contained true -o preview

      - name: Include noncommercial license and notice
        shell: pwsh
        run: |
          Copy-Item LICENSE preview/LICENSE.txt
          Copy-Item NOTICE.md preview/NOTICE.md
          Compress-Archive -Path preview/* -DestinationPath BingLan-Dock-preview-win-x64.zip -CompressionLevel Optimal

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: BingLan-Dock-preview-win-x64
          path: BingLan-Dock-preview-win-x64.zip
          retention-days: 14
